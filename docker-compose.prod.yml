version: '3.3'

services:
  rust-app:
    image: ghcr.io/yhonda-ohishi-pub-dev/rust-pdf-printer:latest
    container_name: rust-pdf-printer
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=info
      - PRINTER_IP=${PRINTER_IP}
      - LISTEN_ADDR=0.0.0.0:8081
      - FONT_PATH=/app/fonts/ipaexg.ttf
    volumes:
      - ./fonts:/app/fonts:ro
    networks:
      - nginx_default
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nginx_default:
    external: true
