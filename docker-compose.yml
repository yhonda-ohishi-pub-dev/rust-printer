version: '3.8'

services:
  rust-app:
    build:
      context: ./rust-app
      dockerfile: Dockerfile
    container_name: rust-pdf-printer
    network_mode: host
    environment:
      - RUST_LOG=info
      - PRINTER_IP=${PRINTER_IP:-172.18.21.60}
      - LISTEN_ADDR=0.0.0.0:8081
      - FONT_PATH=/app/fonts/ipaexg.ttf
    volumes:
      - ./fonts:/app/fonts:ro
    restart: unless-stopped
