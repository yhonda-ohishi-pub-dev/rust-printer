[package]
name = "rust-pdf-printer"
version = "0.1.7"
edition = "2021"

[dependencies]
# HTTP Server
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# PDF Generation
printpdf = "0.8"

# IPP Protocol (for CUPS communication)
ipp = "5.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Regex for text processing
regex = "1.10"

# Temporary files for PWG conversion
tempfile = "3.10"

# UUID for job IDs
uuid = { version = "1.0", features = ["v4"] }

# Async utilities
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
